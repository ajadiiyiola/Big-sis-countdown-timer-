<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Church by 9 am, Big Sis!</title>
<style>
  :root {
    --sky: #9bdcff;
    --cream-sun: #fff1b8;
    --ink: #17315c;
    --royal: #2f5bea;
    --gold: #f5a524;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(to bottom, var(--sky), var(--cream-sun));
  }
  .page {
    width: 100%;
    max-width: 460px;
    padding: 48px 22px 36px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .bell {
    font-size: 4.2rem;
    line-height: 1;
    transform-origin: 50% 8%;
    animation: ring 1.6s ease-in-out infinite;
    margin-bottom: 14px;
  }
  @keyframes ring {
    0%, 100% { transform: rotate(0); }
    15% { transform: rotate(16deg); }
    30% { transform: rotate(-14deg); }
    45% { transform: rotate(10deg); }
    60% { transform: rotate(-6deg); }
    75% { transform: rotate(2deg); }
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.9rem, 8.5vw, 2.5rem);
    line-height: 1.15;
    margin-bottom: 12px;
  }
  .sub {
    font-size: 1.05rem;
    line-height: 1.5;
    max-width: 30ch;
    margin-bottom: 30px;
  }
  .timer {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
    margin-bottom: 14px;
  }
  .unit {
    background: var(--white);
    border-radius: 16px;
    padding: 14px 2px 10px;
    box-shadow: 0 6px 0 rgba(23, 49, 92, 0.12);
  }
  .num {
    display: block;
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: clamp(2rem, 11vw, 2.9rem);
    line-height: 1;
    color: var(--royal);
    font-variant-numeric: tabular-nums;
  }
  .label { display: block; margin-top: 6px; font-size: 0.78rem; }
  .when { font-size: 0.98rem; margin-bottom: 26px; font-weight: 700; }
  .plea {
    background: var(--ink);
    color: var(--white);
    padding: 13px 24px;
    border-radius: 999px;
    font-weight: 700;
  }
  .now .timer, .now .when { display: none; }
  .now h1 { color: var(--royal); }
  @media (prefers-reduced-motion: reduce) { .bell { animation: none; } }
</style>
</head>
<body>
  <main class="page" id="page">
    <div class="bell" aria-hidden="true">🔔</div>
    <h1 id="title">Big Sis, church by 9 am!</h1>
    <p class="sub" id="sub">Don't forget oo. Wake up early and don't be late.</p>

    <div class="timer" role="timer" aria-live="off">
      <div class="unit"><span class="num" id="d">00</span><span class="label">days</span></div>
      <div class="unit"><span class="num" id="h">00</span><span class="label">hours</span></div>
      <div class="unit"><span class="num" id="m">00</span><span class="label">minutes</span></div>
      <div class="unit"><span class="num" id="s">00</span><span class="label">seconds</span></div>
    </div>
    <p class="when" id="when"></p>
    <span class="plea" id="plea">See you there 🙏🏾</span>
  </main>

<script>
  // Counts down to the next Sunday at 9:00 am in the viewer's own time zone.
  // Change SERVICE_DAY (0 = Sunday ... 6 = Saturday) or SERVICE_HOUR if needed.
  var SERVICE_DAY = 0;
  var SERVICE_HOUR = 9;

  // Optional: add ?name=Ada to the link to use her name.
  var name = new URLSearchParams(location.search).get("name");
  var who = name || "Big Sis";

  function pad(n) { return String(n).padStart(2, "0"); }
  function $(id) { return document.getElementById(id); }

  function nextService(now) {
    var t = new Date(now);
    t.setHours(SERVICE_HOUR, 0, 0, 0);
    t.setDate(t.getDate() + ((SERVICE_DAY - t.getDay() + 7) % 7));
    if (t <= now) t.setDate(t.getDate() + 7);
    return t;
  }

  function tick() {
    var now = new Date();
    var start = new Date(now);
    start.setHours(SERVICE_HOUR, 0, 0, 0);
    var inWindow = now.getDay() === SERVICE_DAY && now >= start && (now - start) < 3600000;

    if (inWindow) {
      $("page").classList.add("now");
      $("title").textContent = "It's 9 am. Church time!";
      $("sub").textContent = "Run go, " + who + "! 🏃🏾‍♀️";
      $("plea").textContent = "God bless you 🙌🏾";
      return;
    }

    $("page").classList.remove("now");
    $("title").textContent = who + ", church by 9 am!";
    $("sub").textContent = "Don't forget oo. Wake up early and don't be late.";
    $("plea").textContent = "See you there 🙏🏾";

    var target = nextService(now);
    var diff = Math.floor((target - now) / 1000);
    $("d").textContent = pad(Math.floor(diff / 86400));
    $("h").textContent = pad(Math.floor((diff % 86400) / 3600));
    $("m").textContent = pad(Math.floor((diff % 3600) / 60));
    $("s").textContent = pad(diff % 60);
    $("when").textContent =
      target.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }) +
      " at 9:00 am";
    document.title = "Church by 9 am, " + who + "!";
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
